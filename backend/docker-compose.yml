services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mehar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mehar_dev}
      POSTGRES_DB: mehar
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mehar -d mehar"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mehar:${POSTGRES_PASSWORD:-mehar_dev}@postgres:5432/mehar?sslmode=disable
      API_ADDR: ":8080"
      UPLOAD_DIR: /data/uploads
      ALLOW_ORIGIN: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in backend/.env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in backend/.env}
      # localhost is treated as a secure context by browsers; set to "true" behind HTTPS in prod.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  uploads:

